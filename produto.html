<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto — Tulipa Lingerie</title>
  <meta name="description" content="Lingerie artesanal de luxo da Tulipa Lingerie. Feita à mão em Santa Maria-DF.">
  <meta name="robots" content="index, follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&family=Italianno&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .product-page { padding-top: calc(var(--navbar-h) + var(--sp-12)); padding-bottom: var(--section); }
    .product-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--sp-16);
      align-items: start;
    }
    .related-section { padding-block: var(--section); border-top: 1px solid var(--gray-soft); }
    @media (max-width: 768px) {
      .product-wrap { grid-template-columns: 1fr; gap: var(--sp-8); }
      .product-page { padding-top: calc(var(--navbar-h) + var(--sp-6)); }
    }
  </style>
</head>
<body>
  <a href="#produto-conteudo" class="sr-only">Ir para o conteúdo do produto</a>

  <!-- NAVBAR -->
  <header>
    <nav id="navbar" role="navigation" aria-label="Navegação principal">
      <div class="navbar__left">
        <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="mobile-menu">
          <span class="menu-toggle__bar"></span>
          <span class="menu-toggle__bar"></span>
          <span class="menu-toggle__bar"></span>
        </button>
      </div>
      <a href="index.html" class="navbar__logo" aria-label="Tulipa Lingerie">
        Tulipa
        <span>Lingerie ✦ Santa Maria-DF</span>
      </a>
      <div class="navbar__desktop-links">
        <a href="index.html#catalogo" class="navbar__desktop-link">Coleção</a>
        <a href="sobre.html" class="navbar__desktop-link">Nossa História</a>
        <a href="index.html#newsletter" class="navbar__desktop-link">Contato</a>
      </div>
      <div class="navbar__right">
        <a href="index.html" class="navbar__icon-btn hide-mobile" aria-label="Buscar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </a>
        <button class="navbar__icon-btn" aria-label="Favoritos">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
        <a href="carrinho.html" class="navbar__icon-btn" aria-label="Sacola">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0"/></svg>
          <span class="cart-badge" aria-label="Itens na sacola">0</span>
        </a>
      </div>
    </nav>
  </header>

  <!-- Menu mobile -->
  <div id="mobile-menu" role="dialog" aria-modal="true" aria-label="Menu navegação">
    <nav class="mobile-menu__nav">
      <a href="index.html" class="mobile-menu__link">Início</a>
      <a href="index.html#catalogo" class="mobile-menu__link">Coleção</a>
      <a href="sobre.html" class="mobile-menu__link">Nossa História</a>
      <a href="carrinho.html" class="mobile-menu__link">Sacola</a>
    </nav>
    <p class="mobile-menu__footer">Santa Maria · Brasília-DF 🌷</p>
  </div>
  <div id="menu-overlay" aria-hidden="true"></div>
  <div id="cursor-dot" aria-hidden="true"></div>
  <div id="cursor-ring" aria-hidden="true"></div>

  <main id="produto-conteudo" tabindex="-1">
    <div class="container product-page">

      <!-- Breadcrumb -->
      <nav id="breadcrumb" class="breadcrumb" aria-label="Caminho de navegação">
        <a href="index.html">Início</a>
        <span aria-hidden="true">›</span>
        <a href="index.html#catalogo">Catálogo</a>
        <span aria-hidden="true">›</span>
        <span aria-current="page">Carregando...</span>
      </nav>

      <!-- Produto wrap: galeria + info -->
      <div class="product-wrap" id="product-wrap">
        <!-- Galeria -->
        <div id="product-gallery" class="product-gallery-wrap">
          <!-- Gerado por product.js -->
          <div class="skeleton skeleton-img"></div>
        </div>

        <!-- Informações -->
        <div id="product-info">
          <!-- Gerado por product.js -->
          <div class="skeleton skeleton-text skeleton-text--medium" style="height:32px;margin-bottom:1rem"></div>
          <div class="skeleton skeleton-text skeleton-text--full" style="height:20px;margin-bottom:0.5rem"></div>
          <div class="skeleton skeleton-text skeleton-text--short" style="height:20px"></div>
        </div>
      </div>

      <!-- Produtos relacionados -->
      <section class="related-section" aria-label="Você também vai amar">
        <div style="margin-bottom:var(--sp-8)">
          <span class="section-eyebrow">Combinações</span>
          <h2 class="section-title" style="margin-top:0.5rem">Você também<br><em>vai amar.</em></h2>
        </div>
        <div id="related-grid" class="related-grid">
          <!-- Gerado por product.js -->
        </div>
      </section>
    </div>
  </main>

  <!-- Footer compacto -->
  <footer>
    <div class="container">
      <div class="footer__bottom" style="justify-content:center;text-align:center;flex-direction:column;gap:0.5rem">
        <a href="index.html" style="font-family:var(--font-accent);font-size:1.8rem;color:var(--gold)">Tulipa</a>
        <p>© 2026 Tulipa Lingerie · <a href="index.html#catalogo" style="color:rgba(250,247,242,0.5)">Ver toda a coleção</a></p>
      </div>
    </div>
  </footer>

  <!-- SCRIPTS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js" crossorigin="anonymous"></script>

  <script src="js/produtos.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/product.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
